<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1180" height="430" fill="#ffffff"/>

  <!-- Tool layer group -->
  <rect x="750" y="30" width="200" height="330" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="850" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Tool layer</text>
  <text x="850" y="65" text-anchor="middle" font-size="11" fill="#475569">logging + error wrapper</text>

  <!-- Entry points -->
  <rect x="20" y="70" width="140" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="92" text-anchor="middle" font-size="14" fill="#1f2937">React UI</text>
  <text x="90" y="108" text-anchor="middle" font-size="11" fill="#6b7280">(optional)</text>

  <rect x="200" y="70" width="140" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="270" y="100" text-anchor="middle" font-size="14" fill="#1f2937">FastAPI wrapper</text>

  <rect x="20" y="250" width="140" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="280" text-anchor="middle" font-size="14" fill="#1f2937">CLI</text>

  <!-- Core -->
  <rect x="380" y="160" width="140" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="190" text-anchor="middle" font-size="14" fill="#1f2937">Input validation</text>

  <rect x="560" y="160" width="150" height="50" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="635" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">LangGraph agent loop</text>

  <rect x="560" y="40" width="150" height="50" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="635" y="70" text-anchor="middle" font-size="14" fill="#1f2937">Gemini Flash-Lite</text>

  <!-- Tools -->
  <rect x="770" y="85" width="160" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="850" y="115" text-anchor="middle" font-size="12.5" fill="#1f2937">search_destination_guide</text>

  <rect x="770" y="250" width="160" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="850" y="280" text-anchor="middle" font-size="12.5" fill="#1f2937">get_weather_forecast</text>

  <!-- Data / external -->
  <rect x="990" y="85" width="170" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="1075" y="107" text-anchor="middle" font-size="13" fill="#1f2937">ChromaDB</text>
  <text x="1075" y="123" text-anchor="middle" font-size="11" fill="#6b7280">bge-small embeddings</text>

  <rect x="990" y="250" width="170" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="1075" y="272" text-anchor="middle" font-size="13" fill="#1f2937">Weather service</text>
  <text x="1075" y="288" text-anchor="middle" font-size="11" fill="#6b7280">TTL cache, retries</text>

  <rect x="990" y="340" width="170" height="50" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1075" y="362" text-anchor="middle" font-size="13" fill="#1f2937">Open-Meteo</text>
  <text x="1075" y="378" text-anchor="middle" font-size="11" fill="#6b7280">geocoding, forecast, archive</text>

  <!-- Log file -->
  <rect x="560" y="300" width="150" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="635" y="330" text-anchor="middle" font-size="13" fill="#1f2937">logs/trace.jsonl</text>

  <!-- Arrows -->
  <g stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M160 95 H200"/>
    <path d="M340 95 H360 V175 H380"/>
    <path d="M160 275 H360 V195 H380"/>
    <path d="M520 185 H560"/>
    <path d="M710 185 H730 V110 H770"/>
    <path d="M710 185 H730 V275 H770"/>
    <path d="M930 110 H990"/>
    <path d="M930 275 H990"/>
    <path d="M1075 300 V340"/>
  </g>

  <!-- Two-way: agent <-> Gemini -->
  <path d="M635 160 V90" stroke="#374151" stroke-width="1.8" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="645" y="130" font-size="11" fill="#374151">messages and</text>
  <text x="645" y="143" font-size="11" fill="#374151">tool requests</text>

  <!-- Log (dotted) -->
  <path d="M635 210 V300" stroke="#6b7280" stroke-width="1.6" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="645" y="250" font-size="11" fill="#6b7280">every decision</text>
  <text x="645" y="263" font-size="11" fill="#6b7280">and tool call</text>

  <!-- Note -->
  <text x="20" y="415" font-size="13" fill="#4b5563">The final answer returns along the same path in reverse (agent loop, then API or CLI, then the user), together with the trace_id.</text>
</svg>
